<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لیگ مجازی مربیان</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#111827,#172033);border:1px solid #293548;border-radius:18px;padding:22px;text-align:center;margin-bottom:16px}.hero h1{margin:0 0 8px}.card{background:#11161e;border:1px solid #293548;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}label{display:block;margin:8px 0;color:#cbd5e1}input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #344054;background:#090e15;color:#fff;font-size:15px}button{background:#2563eb;border:0;font-weight:700;cursor:pointer;margin-top:8px}button:hover{filter:brightness(1.1)}.search{position:relative}.suggest{position:absolute;top:78px;left:0;right:0;z-index:20;background:#111827;border:1px solid #374151;border-radius:10px;overflow:hidden;display:none}.suggest div{padding:11px;cursor:pointer}.suggest div:hover{background:#1f2937}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:9px;max-height:430px;overflow:auto}.player{padding:11px;border:1px solid #303b4b;border-radius:11px;background:#0b1017;cursor:pointer}.player:hover{border-color:#60a5fa}.player.sel{border-color:#22c55e;background:#062b1a}.player b{display:block}.player small{color:#9ca3af}.selected{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{padding:7px 9px;background:#1e293b;border-radius:999px;font-size:12px;cursor:pointer}.chip.main{background:#064e3b}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#172033;color:#cbd5e1}.err{background:#3b1111;color:#fecaca}.pitch{background:radial-gradient(circle,#17613d,#0b3b27);border:2px solid #285f45;border-radius:16px;padding:15px;margin-top:12px}.line{display:flex;justify-content:space-around;gap:8px;margin:12px 0;flex-wrap:wrap}.slot{min-width:90px;background:#0b1017cc;border:1px solid #4ade80;border-radius:10px;padding:8px;text-align:center}.slot small{display:block;color:#9ca3af}.result{text-align:center;font-size:42px;font-weight:800;margin:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.stat{background:#0b1017;border:1px solid #293548;border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:19px;margin-top:5px}.event{padding:9px;background:#0b1017;border-radius:9px;margin:6px 0}.hidden{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}.muted{color:#94a3b8}.danger{background:#dc2626}.green{background:#059669}
</style></head><body><div class="wrap"><div class="hero"><h1>⚽ لیگ مجازی مربیان</h1><div class="muted">انتخاب تیم → ساخت ترکیب → تاکتیک → شروع مسابقه</div></div>
<div class="card"><h2>🏟️ انتخاب تیم‌ها</h2><div class="grid"><div class="search"><label>🏠 تیم میزبان</label><input id="homeInput" placeholder="مثلاً Real Madrid" autocomplete="off"><div id="homeSug" class="suggest"></div><div id="homeInfo" class="muted"></div></div><div class="search"><label>✈️ تیم مهمان</label><input id="awayInput" placeholder="مثلاً Barcelona" autocomplete="off"><div id="awaySug" class="suggest"></div><div id="awayInfo" class="muted"></div></div></div></div>
<div id="setup" class="hidden"><div class="card"><h2>⚙️ آرایش و تاکتیک</h2><div class="grid"><div><label>آرایش میزبان</label><select id="hf"><option>4-3-3</option><option>4-2-3-1</option><option>4-4-2</option><option>3-5-2</option><option>5-3-2</option><option>4-3-1-2</option></select></div><div><label>آرایش مهمان</label><select id="af"><option>4-3-3</option><option>4-2-3-1</option><option>4-4-2</option><option>3-5-2</option><option>5-3-2</option><option>4-3-1-2</option></select></div><div><label>تاکتیک میزبان</label><select id="ht"><option value="balanced">متعادل</option><option value="attacking">هجومی</option><option value="defensive">دفاعی</option><option value="possession">مالکیت</option><option value="counter">ضدحمله</option><option value="pressing">پرس شدید</option></select></div><div><label>تاکتیک مهمان</label><select id="at"><option value="balanced">متعادل</option><option value="attacking">هجومی</option><option value="defensive">دفاعی</option><option value="possession">مالکیت</option><option value="counter">ضدحمله</option><option value="pressing">پرس شدید</option></select></div></div></div>
<div class="two"><div class="card"><h2>🏠 بازیکنان میزبان</h2><div id="homePlayers" class="players"></div><h3>ترکیب انتخاب‌شده</h3><div id="homeSelected" class="selected"></div><div id="homeCount" class="muted"></div><div id="homePitch" class="pitch"></div></div><div class="card"><h2>✈️ بازیکنان مهمان</h2><div id="awayPlayers" class="players"></div><h3>ترکیب انتخاب‌شده</h3><div id="awaySelected" class="selected"></div><div id="awayCount" class="muted"></div><div id="awayPitch" class="pitch"></div></div></div>
<div class="card"><button class="green" onclick="startGame()">▶️ شروع بازی</button><div id="msg"></div></div></div>
<div id="result" class="card hidden"><h2>🏆 نتیجه مسابقه</h2><div id="teams" style="text-align:center"></div><div id="score" class="result"></div><h3>📊 آمار</h3><div id="stats" class="stats"></div><div class="grid"><div><h3>⚽ گل‌ها</h3><div id="goals"></div><h3>🟨 کارت زرد</h3><div id="yellow"></div><h3>🟥 کارت قرمز</h3><div id="red"></div></div><div><h3>🔄 تعویض‌ها</h3><div id="subs"></div><h3>⭐ بهترین بازیکن</h3><div id="best"></div></div></div><button onclick="downloadResult()">📥 دانلود تصویر نتیجه</button></div></div>
<script src="بازیکنان.js"></script><script src="شبیه ساز تطابق.js"></script><script>
let HOME=null,AWAY=null,HS=[],AS=[];const $=id=>document.getElementById(id);function names(){return Object.keys(window.TEAMS||{})}function players(team){if(!team)return[];let ids=team.players||[];if(ids.length&&typeof ids[0]==='string')return ids.map(id=>window.getPlayerById(id)).filter(Boolean);return ids}function findTeam(q){let n=names(),x=String(q||'').trim().toLowerCase();return n.find(a=>a.toLowerCase()===x)||n.find(a=>a.toLowerCase().includes(x))}
function searchBox(input,sug,info,side){$(input).addEventListener('input',()=>{let q=$(input).value.toLowerCase().trim();$(sug).innerHTML='';if(!q){$(sug).style.display='none';return}let arr=names().filter(n=>n.toLowerCase().includes(q)).slice(0,8);arr.forEach(n=>{let d=document.createElement('div');d.textContent=n;d.onclick=()=>selectTeam(n,side);$(sug).appendChild(d)});$(sug).style.display=arr.length?'block':'none'});$(input).addEventListener('keydown',e=>{if(e.key==='Enter'){let n=findTeam($(input).value);if(n)selectTeam(n,side)}})}
function selectTeam(name,side){let t=window.TEAMS[name];if(side==='home'){HOME=t;$('homeInput').value=name;$('homeSug').style.display='none';$('homeInfo').textContent='👥 '+players(t).length+' بازیکن';renderPlayers('home')}else{AWAY=t;$('awayInput').value=name;$('awaySug').style.display='none';$('awayInfo').textContent='👥 '+players(t).length+' بازیکن';renderPlayers('away')}if(HOME&&AWAY)$('setup').classList.remove('hidden')}
function renderPlayers(side){let t=side==='home'?HOME:AWAY,box=$(side==='home'?'homePlayers':'awayPlayers'),sel=side==='home'?HS:AS;box.innerHTML='';players(t).forEach(p=>{let d=document.createElement('div');d.className='player'+(sel.some(x=>x.id===p.id)?' sel':'');d.innerHTML='<b>'+p.name+'</b><small>'+p.position+' • OVR '+p.overall+'</small>';d.onclick=()=>toggle(p,side);box.appendChild(d)});renderSelected(side)}
function toggle(p,side){let s=side==='home'?HS:AS,i=s.findIndex(x=>x.id===p.id);if(i>=0)s.splice(i,1);else{if(s.length>=16){msg('هر تیم حداکثر ۱۱ اصلی + ۵ نیمکت دارد.',true);return}s.push(p)}renderPlayers(side)}
function renderSelected(side){let s=side==='home'?HS:AS,box=$(side==='home'?'homeSelected':'awaySelected');box.innerHTML='';s.forEach((p,i)=>{let d=document.createElement('span');d.className='chip '+(i<11?'main':'');d.textContent=(i<11?'XI ':'BENCH ')+(i+1)+' • '+p.name;d.title='برای حذف کلیک کنید';d.onclick=()=>{s.splice(i,1);renderPlayers(side)};box.appendChild(d)});$(side==='home'?'homeCount':'awayCount').textContent='اصلی: '+Math.min(11,s.length)+' / 11 | نیمکت: '+Math.max(0,s.length-11)+' / 5';renderPitch(side)}
function renderPitch(side){let s=side==='home'?HS.slice(0,11):AS.slice(0,11),formation=$(side==='home'?'hf':'af').value,arr=(window.FORMATIONS&&window.FORMATIONS[formation])||[];let box=$(side==='home'?'homePitch':'awayPitch');box.innerHTML='<div class="line">'+s.map((p,i)=>'<div class="slot"><small>'+((arr[i])||p.position||'POS')+'</small><b>'+p.name+'</b></div>').join('')+'</div>';}
$('hf').onchange=()=>renderPitch('home');$('af').onchange=()=>renderPitch('away');searchBox('homeInput','homeSug','homeInfo','home');searchBox('awayInput','awaySug','awayInfo','away');
function msg(t,e){$('msg').className='msg'+(e?' err':'');$('msg').textContent=t}
function startGame(){if(!HOME||!AWAY)return msg('اول دو تیم را انتخاب کن.',true);if(HS.length<11||AS.length<11)return msg('برای هر دو تیم دقیقاً حداقل ۱۱ بازیکن اصلی انتخاب کن.',true);let h={...HOME,name:$('homeInput').value,players:HS.slice(0,11),startingXI:HS.slice(0,11),bench:HS.slice(11),formation:$('hf').value,tactics:$('ht').value};let a={...AWAY,name:$('awayInput').value,players:AS.slice(0,11),startingXI:AS.slice(0,11),bench:AS.slice(11),formation:$('af').value,tactics:$('at').value};let r=window.simulateFullMatch(h,a);showResult(r,h,a)}
function showResult(r,h,a){$('result').classList.remove('hidden');$('teams').textContent=h.name+' 🆚 '+a.name;$('score').textContent=r.score.home+' - '+r.score.away;let st=r.stats||{},map=[['مالکیت میزبان',st.homePossession],['مالکیت مهمان',st.awayPossession],['شوت میزبان',st.homeShots],['شوت مهمان',st.awayShots],['در چارچوب میزبان',st.homeShotsOnTarget],['در چارچوب مهمان',st.awayShotsOnTarget],['کرنر میزبان',st.homeCorners],['کرنر مهمان',st.awayCorners],['خطای میزبان',st.homeFouls],['خطای مهمان',st.awayFouls],['آفساید میزبان',st.homeOffsides],['آفساید مهمان',st.awayOffsides],['پاس میزبان',st.homePasses],['پاس مهمان',st.awayPasses],['دقت پاس میزبان',st.homePassAccuracy],['دقت پاس مهمان',st.awayPassAccuracy]];$('stats').innerHTML=map.map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('');events('goals',r.goals||[],'⚽',e=>`دقیقه ${e.minute} — ${e.player} (${e.team})`);events('yellow',r.yellowCards||[],'🟨',e=>`دقیقه ${e.minute} — ${e.player} (${e.team})`);events('red',r.redCards||[],'🟥',e=>`دقیقه ${e.minute} — ${e.player} (${e.team})`);events('subs',r.substitutions||[],'🔄',e=>`دقیقه ${e.minute} — ${e.out} ← ${e.in} (${e.team})`);$('best').innerHTML=r.bestPlayer?'<div class="event">⭐ '+r.bestPlayer.name+' — '+Number(r.bestPlayer.rating).toFixed(1)+'</div>':'—';$('result').scrollIntoView({behavior:'smooth'})}
function events(id,a,icon,fn){$(id).innerHTML=a.length?a.map(e=>'<div class="event">'+icon+' '+fn(e)+'</div>').join(''):'<div class="msg">موردی ثبت نشد.</div>'}
function downloadResult(){let c=document.createElement('canvas'),x=c.getContext('2d'),w=1000,h=1300;c.width=w;c.height=h;x.fillStyle='#080b10';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.textAlign='center';x.font='bold 38px Arial';x.fillText('لیگ مجازی مربیان',w/2,60);x.font='bold 28px Arial';x.fillText($('teams').textContent,w/2,120);x.font='bold 72px Arial';x.fillText($('score').textContent,w/2,205);x.font='20px Arial';let y=255;$('stats').querySelectorAll('.stat').forEach(e=>{x.fillText(e.innerText.replace(/\n/g,' : '),w/2,y);y+=32});x.font='bold 26px Arial';x.fillText('⚽ گل‌ها',w/2,y+30);y+=70;x.font='19px Arial';$('goals').querySelectorAll('.event').forEach(e=>{x.fillText(e.innerText,w/2,y);y+=30});let a=document.createElement('a');a.download='match-result.png';a.href=c.toDataURL('image/png');a.click()}
</script></body></html>
