<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیگ مجازی مربیان</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#070b12;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

.container{
    width:94%;
    max-width:1100px;
    margin:20px auto;
}

.card{
    background:#111827;
    border:1px solid #293548;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

h1,h2,h3{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }
}

label{
    display:block;
    margin:10px 0 7px;
    color:#cbd5e1;
}

input,select,button{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #374151;
    background:#0b111b;
    color:white;
    font-size:15px;
}

button{
    background:#2563eb;
    border:0;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

button:active{
    transform:scale(.98);
}

.hidden{
    display:none !important;
}

.notice{
    padding:12px;
    border-radius:10px;
    background:#172033;
    margin:12px 0;
}

.error{
    background:#3a1115;
    color:#fecaca;
}

.team-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.position{
    background:#0b111b;
    border-radius:12px;
    padding:12px;
    margin-bottom:9px;
}

.position-title{
    color:#94a3b8;
    font-size:13px;
    margin-bottom:7px;
}

.player-input{
    margin:0;
}

.score{
    text-align:center;
    font-size:55px;
    font-weight:bold;
    margin:20px 0;
}

.teams{
    text-align:center;
    font-size:21px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
}

.stat{
    background:#0b111b;
    padding:14px;
    border-radius:10px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:20px;
    margin-top:6px;
}

.event{
    background:#0b111b;
    padding:11px;
    border-radius:9px;
    margin:7px 0;
}
</style>
</head>

<body>

<div class="container">

<!-- ========================= -->
<!-- صفحه اصلی -->
<!-- ========================= -->

<div class="card">
    <h1>⚽ لیگ مجازی مربیان</h1>
    <p>شبیه‌ساز مسابقه فوتبال</p>
</div>


<!-- ========================= -->
<!-- مرحله ۱ -->
<!-- ========================= -->

<section id="step1" class="card">

    <h2>🏟️ شروع مسابقه</h2>

    <div class="grid">

        <div>
            <label>🏠 تیم میزبان</label>

            <input
                id="homeTeam"
                type="text"
                placeholder="نام تیم میزبان"
            >
        </div>

        <div>
            <label>✈️ تیم مهمان</label>

            <input
                id="awayTeam"
                type="text"
                placeholder="نام تیم مهمان"
            >
        </div>

    </div>

    <button type="button" id="nextStepBtn">
        ادامه ➜
    </button>

    <div id="step1Message"></div>

</section>


<!-- ========================= -->
<!-- مرحله ۲ -->
<!-- ========================= -->

<section id="step2" class="card hidden">

    <h2>👥 ترکیب تیم‌ها</h2>

    <div class="notice">
        اسم بازیکنان را خودت تایپ کن.
        نیازی به کلیک روی بازیکن نیست.
    </div>


    <div class="grid">

        <!-- تیم میزبان -->

        <div>

            <div
                id="homeTeamTitle"
                class="team-title">
                🏠 تیم میزبان
            </div>

            <label>آرایش</label>

            <select id="homeFormation">
                <option>4-3-3</option>
                <option>4-2-3-1</option>
                <option>4-4-2</option>
                <option>3-5-2</option>
                <option>5-3-2</option>
            </select>

            <div id="homePlayers"></div>

            <h3>🪑 نیمکت</h3>

            <div id="homeBench"></div>

        </div>


        <!-- تیم مهمان -->

        <div>

            <div
                id="awayTeamTitle"
                class="team-title">
                ✈️ تیم مهمان
            </div>

            <label>آرایش</label>

            <select id="awayFormation">
                <option>4-3-3</option>
                <option>4-2-3-1</option>
                <option>4-4-2</option>
                <option>3-5-2</option>
                <option>5-3-2</option>
            </select>

            <div id="awayPlayers"></div>

            <h3>🪑 نیمکت</h3>

            <div id="awayBench"></div>

        </div>

    </div>


    <button
        type="button"
        id="nextTacticBtn">
        تأیید ترکیب و مرحله بعد ➜
    </button>

    <div id="lineupMessage"></div>

</section>


<!-- ========================= -->
<!-- مرحله ۳ -->
<!-- ========================= -->

<section id="step3" class="card hidden">

    <h2>🎯 تاکتیک</h2>

    <div class="grid">

        <div>

            <h3 id="homeTacticTitle"></h3>

            <label>تاکتیک</label>

            <select id="homeTactic">

                <option value="balanced">
                    ⚖️ متعادل
                </option>

                <option value="attacking">
                    🔥 هجومی
                </option>

                <option value="defensive">
                    🛡️ دفاعی
                </option>

                <option value="possession">
                    🎯 مالکیت توپ
                </option>

                <option value="counter">
                    ⚡ ضدحمله
                </option>

                <option value="pressing">
                    💨 پرس شدید
                </option>

            </select>

        </div>


        <div>

            <h3 id="awayTacticTitle"></h3>

            <label>تاکتیک</label>

            <select id="awayTactic">

                <option value="balanced">
                    ⚖️ متعادل
                </option>

                <option value="attacking">
                    🔥 هجومی
                </option>

                <option value="defensive">
                    🛡️ دفاعی
                </option>

                <option value="possession">
                    🎯 مالکیت توپ
                </option>

                <option value="counter">
                    ⚡ ضدحمله
                </option>

                <option value="pressing">
                    💨 پرس شدید
                </option>

            </select>

        </div>

    </div>


    <button
        type="button"
        id="startMatchBtn">
        ⚽ شروع مسابقه
    </button>

</section>


<!-- ========================= -->
<!-- نتیجه -->
<!-- ========================= -->

<section id="result" class="card hidden">

    <h2>🏆 نتیجه مسابقه</h2>

    <div
        id="resultTeams"
        class="teams">
    </div>

    <div
        id="resultScore"
        class="score">
    </div>


    <h3>⚽ گلزنان</h3>
    <div id="goals"></div>


    <h3>🟨 کارت زرد</h3>
    <div id="yellowCards"></div>


    <h3>🟥 کارت قرمز</h3>
    <div id="redCards"></div>


    <h3>🔄 تعویض‌ها</h3>
    <div id="substitutions"></div>


    <h3>📊 آمار بازی</h3>
    <div id="matchStats" class="stats"></div>


    <h3>⭐ بهترین بازیکن</h3>
    <div id="mvp"></div>


    <button
        type="button"
        id="downloadBtn">
        📥 دانلود تصویر نتیجه
    </button>

</section>

</div>


<script>

/* ======================================
   متغیرها
====================================== */

let homeTeam = "";
let awayTeam = "";

let homePlayers = [];
let awayPlayers = [];

let homeBench = [];
let awayBench = [];


/* ======================================
   پست‌های اصلی
====================================== */

const positions = [

    "دروازه‌بان",

    "دفاع راست",

    "مدافع وسط ۱",

    "مدافع وسط ۲",

    "دفاع چپ",

    "هافبک دفاعی",

    "هافبک مرکزی",

    "هافبک هجومی",

    "وینگر راست",

    "مهاجم",

    "وینگر چپ"

];


/* ======================================
   مرحله ۱
====================================== */

document
.getElementById("nextStepBtn")
.addEventListener("click", function(){

    homeTeam =
        document
        .getElementById("homeTeam")
        .value
        .trim();

    awayTeam =
        document
        .getElementById("awayTeam")
        .value
        .trim();


    if(homeTeam === "" || awayTeam === ""){

        document
        .getElementById("step1Message")
        .innerHTML =
        '<div class="notice error">اول اسم هر دو تیم را وارد کن.</div>';

        return;
    }


    if(
        homeTeam.toLowerCase() ===
        awayTeam.toLowerCase()
    ){

        document
        .getElementById("step1Message")
        .innerHTML =
        '<div class="notice error">دو تیم نمی‌توانند یکسان باشند.</div>';

        return;
    }


    /* ساخت ترکیب */

    createLineup(
        "homePlayers",
        "home"
    );

    createLineup(
        "awayPlayers",
        "away"
    );


    createBench(
        "homeBench",
        "home"
    );

    createBench(
        "awayBench",
        "away"
    );


    document
    .getElementById("homeTeamTitle")
    .textContent =
    "🏠 " + homeTeam;


    document
    .getElementById("awayTeamTitle")
    .textContent =
    "✈️ " + awayTeam;


    /* مخفی کردن مرحله اول */

    document
    .getElementById("step1")
    .classList
    .add("hidden");


    /* نمایش مرحله دوم */

    document
    .getElementById("step2")
    .classList
    .remove("hidden");


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});


/* ======================================
   ساخت ترکیب
====================================== */

function createLineup(containerId,type){

    const box =
        document
        .getElementById(containerId);

    box.innerHTML = "";


    positions.forEach(function(position){

        const div =
            document.createElement("div");

        div.className = "position";


        div.innerHTML = `

            <div class="position-title">
                ${position}
            </div>

            <input
                type="text"
                class="player-input ${type}-starting-player"
                placeholder="اسم بازیکن را بنویس"
            >

        `;


        box.appendChild(div);

    });

}


/* ======================================
   نیمکت
====================================== */

function createBench(containerId,type){

    const box =
        document
        .getElementById(containerId);

    box.innerHTML = "";


    for(
        let i=1;
        i<=5;
        i++
    ){

        const input =
            document.createElement("input");


        input.type = "text";

        input.className =
            `${type}-bench-player`;

        input.placeholder =
            "بازیکن نیمکت " + i;

        input.style.marginBottom =
            "8px";


        box.appendChild(input);

    }

}


/* ======================================
   گرفتن ترکیب
====================================== */

function readPlayers(type){

    const inputs =
        document.querySelectorAll(
            `.${type}-starting-player`
        );

    const players = [];


    inputs.forEach(function(input,index){

        const name =
            input.value.trim();


        if(name !== ""){

            players.push({

                name:name,

                position:
                    positions[index],

                /*
                اگر Overall واقعی از
                بانک بازیکنان وصل شود،
                این مقدار جایگزین می‌شود.
                */

                overall:75

            });

        }

    });


    return players;

}


/* ======================================
   گرفتن نیمکت
====================================== */

function readBench(type){

    const inputs =
        document.querySelectorAll(
            `.${type}-bench-player`
        );

    const bench=[];


    inputs.forEach(function(input){

        const name =
            input.value.trim();


        if(name !== ""){

            bench.push({

                name:name,

                overall:75

            });

        }

    });


    return bench;

}


/* ======================================
   مرحله ۲
====================================== */

document
.getElementById("nextTacticBtn")
.addEventListener("click",function(){

    homePlayers =
        readPlayers("home");

    awayPlayers =
        readPlayers("away");


    homeBench =
        readBench("home");

    awayBench =
        readBench("away");


    if(homePlayers.length !== 11){

        document
        .getElementById("lineupMessage")
        .innerHTML =
        '<div class="notice error">برای تیم میزبان دقیقاً ۱۱ بازیکن اصلی وارد کن.</div>';

        return;

    }


    if(awayPlayers.length !== 11){

        document
        .getElementById("lineupMessage")
        .innerHTML =
        '<div class="notice error">برای تیم مهمان دقیقاً ۱۱ بازیکن اصلی وارد کن.</div>';

        return;

    }


    document
    .getElementById("homeTacticTitle")
    .textContent =
    "🏠 " + homeTeam;


    document
    .getElementById("awayTacticTitle")
    .textContent =
    "✈️ " + awayTeam;


    document
    .getElementById("step2")
    .classList
    .add("hidden");


    document
    .getElementById("step3")
    .classList
    .remove("hidden");


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

});


/* ======================================
   Overall
====================================== */

function getOverall(player){

    return Number(
        player.overall
    ) || 75;

}


function average(players){

    if(players.length===0)
        return 75;


    let total=0;


    players.forEach(function(player){

        total +=
            getOverall(player);

    });


    return total / players.length;

}


/* ======================================
   تأثیر تاکتیک
====================================== */

function tacticPower(tactic){

    const power={

        balanced:0,

        attacking:5,

        defensive:2,

        possession:4,

        counter:4,

        pressing:3

    };


    return power[tactic] || 0;

}


/* ======================================
   بازیکن تصادفی
====================================== */

function randomPlayer(players){

    return players[
        Math.floor(
            Math.random()*players.length
        )
    ];

}


/* ======================================
   شروع مسابقه
====================================== */

document
.getElementById("startMatchBtn")
.addEventListener("click",function(){

    if(
        homePlayers.length !== 11 ||
        awayPlayers.length !== 11
    ){

        alert(
            "ابتدا ترکیب هر دو تیم را کامل کن."
        );

        return;

    }


    const homeTactic =
        document
        .getElementById("homeTactic")
        .value;


    const awayTactic =
        document
        .getElementById("awayTactic")
        .value;


    /* قدرت واقعی ترکیب */

    let homePower =
        average(homePlayers)
        +
        tacticPower(homeTactic)
        +
        3;


    let awayPower =
        average(awayPlayers)
        +
        tacticPower(awayTactic);


    /*
    اختلاف قدرت روی شانس گل
    تأثیر می‌گذارد.
    */

    let homeChance =
        (homePower-65)/8
        +
        Math.random()*2;


    let awayChance =
        (awayPower-65)/8
        +
        Math.random()*2;


    let homeGoals =
        Math.max(
            0,
            Math.round(homeChance)
        );


    let awayGoals =
        Math.max(
            0,
            Math.round(awayChance)
        );


    homeGoals =
        Math.min(7,homeGoals);

    awayGoals =
        Math.min(7,awayGoals);


    /* گل‌ها */

    const goals=[];


    for(
        let i=0;
        i<homeGoals;
        i++
    ){

        const player =
            randomPlayer(homePlayers);


        goals.push({

            minute:
                5+
                Math.floor(
                    Math.random()*86
                ),

            player:
                player.name,

            team:
                homeTeam

        });

    }


    for(
        let i=0;
        i<awayGoals;
        i++
    ){

        const player =
            randomPlayer(awayPlayers);


        goals.push({

            minute:
                5+
                Math.floor(
                    Math.random()*86
                ),

            player:
                player.name,

            team:
                awayTeam

        });

    }


    goals.sort(
        function(a,b){
            return a.minute-b.minute;
        }
    );


    /* مالکیت */

    let possession =
        Math.round(
            50+
            (homePower-awayPower)*0.7
        );


    possession =
        Math.max(
            30,
            Math.min(70,possession)
        );


    /* آمار */

    const stats={

        homePossession:
            possession+"%",

        awayPossession:
            (100-possession)+"%",

        homeShots:
            7+
            homeGoals*2+
            Math.floor(Math.random()*8),

        awayShots:
            7+
            awayGoals*2+
            Math.floor(Math.random()*8),

        homeShotsOnTarget:
            2+
            homeGoals+
            Math.floor(Math.random()*5),

        awayShotsOnTarget:
            2+
            awayGoals+
            Math.floor(Math.random()*5),

        homeCorners:
            2+
            Math.floor(Math.random()*7),

        awayCorners:
            2+
            Math.floor(Math.random()*7),

        homeFouls:
            5+
            Math.floor(Math.random()*10),

        awayFouls:
            5+
            Math.floor(Math.random()*10),

        homeOffsides:
            Math.floor(Math.random()*4),

        awayOffsides:
            Math.floor(Math.random()*4)

    };


    /* کارت زرد */

    const yellow=[];


    if(Math.random()<0.75){

        const p =
            randomPlayer(homePlayers);

        yellow.push({

            minute:
                15+
                Math.floor(Math.random()*70),

            player:p.name,

            team:homeTeam

        });

    }


    if(Math.random()<0.75){

        const p =
            randomPlayer(awayPlayers);

        yellow.push({

            minute:
                15+
                Math.floor(Math.random()*70),

            player:p.name,

            team:awayTeam

        });

    }


    /* کارت قرمز */

    const red=[];


    if(Math.random()<0.08){

        const p =
            randomPlayer(homePlayers);

        red.push({

            minute:
                20+
                Math.floor(Math.random()*60),

            player:p.name,

            team:homeTeam

        });

    }


    if(Math.random()<0.08){

        const p =
            randomPlayer(awayPlayers);

        red.push({

            minute:
                20+
                Math.floor(Math.random()*60),

            player:p.name,

            team:awayTeam

        });

    }


    /* تعویض */

    const substitutions=[];


    if(homeBench.length>0){

        substitutions.push({

            minute:
                55+
                Math.floor(Math.random()*30),

            team:homeTeam,

            player:
                randomPlayer(homeBench).name

        });

    }


    if(awayBench.length>0){

        substitutions.push({

            minute:
                55+
                Math.floor(Math.random()*30),

            team:awayTeam,

            player:
                randomPlayer(awayBench).name

        });

    }


    /* بهترین بازیکن */

    const mvp =
        homePower >= awayPower
        ? randomPlayer(homePlayers)
        : randomPlayer(awayPlayers);


    showResult({

        homeGoals:homeGoals,

        awayGoals:awayGoals,

        goals:goals,

        yellow:yellow,

        red:red,

        substitutions:
            substitutions,

        stats:stats,
