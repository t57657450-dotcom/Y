}

body{

    margin:auto;
    padding:25px 0 60px;
}

.header{
    text-align:center;
    padding:28px 15px;
    border:1px solid #303030;

    font-size:30px;
}

.header p{

    margin:10px 0 0;
}

.teams{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.card{

    border:1px solid #2c2c2c;
    border-radius:20px;
    padding:20px;
}

.card h2{

}

label{

    font-size:14px;
    margin:14px 0 7px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid #363636;
    background:#080808;
    color:#fff;
    outline:none;
    font-family:inherit;
}

textarea{
    height:250px;
    resize:vertical;
    line-height:2;
}

button{
    border:0;
    border-radius:13px;
    padding:15px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

.mainBtn{
    width:100%;
    margin-top:18px;
    background:#fff;
    color:#000;
    font-size:17px;
}

.mainBtn:hover{
    background:#ddd;
}

.result{
    display:none;
    margin-top:20px;
}

.scoreBox{
    text-align:center;
    background:#111;
    border:1px solid #333;
    border-radius:20px;
    padding:25px;
}

.teamNames{
    font-size:20px;
    font-weight:bold;
}

.score{
    font-size:55px;
    font-weight:900;
    margin:12px 0;
}

.winner{
    color:#bbb;
}

.section{
    background:#111;
    border:1px solid #2c2c2c;
    border-radius:18px;
    padding:18px;
    margin-top:15px;
}

.section h3{
    margin-top:0;
}

.stat{
    display:grid;
    grid-template-columns:1fr 90px 1fr;
    gap:10px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #252525;
}

.stat:last-child{
    border-bottom:0;
}

.stat div:nth-child(2){
    text-align:center;
    color:#aaa;
    font-size:13px;
}

.stat div:last-child{
    text-align:left;
}

.event{
    background:#090909;
    border:1px solid #242424;
    border-radius:12px;
    padding:11px;
    margin:8px 0;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.reset{
    width:100%;
    margin-top:18px;
    background:#292929;
    color:#fff;
}

.info{
    color:#999;
    font-size:12px;
    line-height:1.9;
}

@media(max-width:700px){
    .teams,
    .two{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:24px;
    }

    .score{
        font-size:45px;
    }
}
</style>

/* =========================
   نام بازیکن
========================= */

function normalize(name){

    return name
        .toLowerCase()
        .trim()
        .replace(/ي/g,"ی")
        .replace(/ك/g,"ک")
        .replace(/\s+/g," ");

}


/* =========================
   گرفتن اطلاعات بازیکن
========================= */

function getPlayer(name){

    const key=normalize(name);

    if(PLAYERS[key]){
        return PLAYERS[key];
    }

    /*
    بازیکن ناشناخته:
    قدرت متوسط.
    در نسخه API این بخش
    با اطلاعات واقعی جایگزین می‌شود.
    */

    return {
        name:name,
        power:72,
        attack:72,
        midfield:72,
        defense:72,
        position:"MF"
    };

}


/* =========================
   تاکتیک
========================= */

const TACTICS={

balanced:{
    attack:1,
    defense:1,
    midfield:1
},

attacking:{
    attack:1.13,
    defense:.90,
    midfield:1.03
},

defensive:{
    attack:.88,
    defense:1.14,
    midfield:1.02
},

counter:{
    attack:1.08,
    defense:1.04,
    midfield:.94
},

pressing:{
    attack:1.05,
    defense:1.07,
    midfield:1.08
}

};


/* =========================
   تیم
========================= */

function createTeam(names,tactic){

    const players=
        names
        .map(getPlayer)
        .filter(Boolean);

    let attack=0;
    let midfield=0;
    let defense=0;

    players.forEach(p=>{

        attack+=p.attack;
        midfield+=p.midfield;
        defense+=p.defense;

    });

    const count=Math.max(players.length,1);

    attack/=count;
    midfield/=count;
    defense/=count;

    const t=TACTICS[tactic]||TACTICS.balanced;

    attack*=t.attack;
    midfield*=t.midfield;
    defense*=t.defense;

    const power=
        (attack*.40)+
        (midfield*.32)+
        (defense*.28);

    return {

        players,

        attack,
        midfield,
        defense,

        power

    };

}


/* =========================
   عدد تصادفی کنترل‌شده
========================= */

function random(min,max){

    return Math.random()*(max-min)+min;

}


/* =========================
   گل
========================= */

function calculateGoals(team,opponent){

    const difference=
        team.power-opponent.power;

    let expected=
        1.25+
        difference/28;

    expected=
        Math.max(
            .25,
            Math.min(3.4,expected)
        );

    let goals=0;

    /*
    چند موقعیت با احتمال وابسته
    به قدرت تیم ایجاد می‌کنیم.
    */

    for(let i=0;i<5;i++){

        const chance=
            expected*.13+
            random(-.025,.025);

        if(Math.random()<chance){
            goals++;
        }

    }

    /*
    اگر تیم خیلی قوی‌تر باشد،
    احتمال گل بیشتر می‌شود.
    */

    if(
        difference>15 &&
        Math.random()<.55
    ){
        goals++;
    }

    return Math.min(goals,5);

}


/* =========================
   گلزن
========================= */

function scorer(team){

    let candidates=
        team.players.filter(
            p=>p.position==="FW"
        );

    if(!candidates.length){

        candidates=
            team.players.filter(
                p=>p.position==="MF"
            );

    }

    if(!candidates.length)
        candidates=team.players;

    return candidates[
        Math.floor(
            Math.random()*candidates.length
        )
    ];


}


/* =========================
   شبیه‌سازی
========================= */

function simulate(){

    const team1Name=
        document.getElementById("team1")
        .value.trim();

    const team2Name=
        document.getElementById("team2")
        .value.trim();

    if(!team1Name||!team2Name){

        alert("نام هر دو تیم را وارد کن.");
        return;

    }


    const names1=
        document.getElementById("players1")
        .value
        .split("\n")
        .map(x=>x.trim())
        .filter(Boolean);


    const names2=
        document.getElementById("players2")
        .value
        .split("\n")
        .map(x=>x.trim())
        .filter(Boolean);


    if(!names1.length||!names2.length){

        alert("بازیکنان هر دو تیم را وارد کن.");
        return;

    }


    const tactic1=
        document.getElementById("tactic1")
        .value;

    const tactic2=
        document.getElementById("tactic2")
        .value;


    const team1=
        createTeam(names1,tactic1);

    const team2=
        createTeam(names2,tactic2);


    let score1=
        calculateGoals(team1,team2);

    let score2=
        calculateGoals(team2,team1);


    /*
    اختلاف شدید قدرت
    */

    const difference=
        team1.power-team2.power;


    if(
        difference>18 &&
        score1<=score2 &&
        Math.random()<.72
    ){
        score1=
            Math.min(5,score2+1);
    }


    if(
        difference<-18 &&
        score2<=score1 &&
        Math.random()<.72
    ){
        score2=
            Math.min(5,score1+1);
    }


    /*
    مالکیت
    */

    let possession1=
        50+
        (team1.midfield-team2.midfield)*.38;

    possession1=
        Math.round(
            Math.max(
                30,
                Math.min(70,possession1)
            )
        );

    const possession2=
        100-possession1;


    /*
    شوت
    */

    const shots1=
        Math.max(
            3,
            Math.round(
                7+
                team1.attack/9+
                random(-2,3)
            )
        );

    const shots2=
        Math.max(
            3,
            Math.round(
                7+
                team2.attack/9+
                random(-2,3)
            )
        );


    const onTarget1=
        Math.min(
            shots1,
            Math.max(
                score1,
                Math.round(
                    shots1*.35+
                    random(-1,2)
                )
            )
        );


    const onTarget2=
        Math.min(
            shots2,
            Math.max(
                score2,
                Math.round(
                    shots2*.35+
                    random(-1,2)
                )
            )
        );


    /*
    خطا
    */

    const fouls1=
        Math.round(
            random(7,17)
        );

    const fouls2=
        Math.round(
            random(7,17)
        );


    /*
    کاشته
    */

    const free1=
        Math.round(
            fouls2*.65
        );

    const free2=
        Math.round(
            fouls1*.65
        );


    /*
    کرنر
    */

    const corners1=
        Math.max(
            1,
            Math.round(
                shots1*.42
            )
        );

    const corners2=
        Math.max(
            1,
            Math.round(
                shots2*.42
            )
        );


    /*
    گل‌ها
    */

    const goals=[];


    for(
        let i=0;
        i<score1;
        i++
    ){

        const p=scorer(team1);

        goals.push({

            minute:
                Math.floor(
                    random(5,89)
                ),

            team:team1Name,

            player:p.name

        });

    }


    for(
        let i=0;
        i<score2;
        i++
    ){

        const p=scorer(team2);

        goals.push({

            minute:
                Math.floor(
                    random(5,89)
                ),

            team:team2Name,

            player:p.name

        });

    }


    goals.sort(
        (a,b)=>
        a.minute-b.minute
    );


    /*
    کارت زرد
    */

    const yellow=[];

    const yellow1=
        Math.random()<.82
        ?Math.floor(random(0,3))
        :0;

    const yellow2=
        Math.random()<.82
        ?Math.floor(random(0,3))
        :0;


    for(
        let i=0;
        i<yellow1;
        i++
    ){

        yellow.push({

            minute:
                Math.floor(random(15,88)),

            team:team1Name,

            player:
                team1.players[
                    Math.floor(
                        Math.random()*
                        team1.players.length
                    )
                ].name

        });

    }


    for(
        let i=0;
        i<yellow2;
        i++
    ){

        yellow.push({

            minute:
                Math.floor(random(15,88)),

            team:team2Name,

            player:
                team2.players[
                    Math.floor(
                        Math.random()*
                        team2.players.length
                    )
                ].name

        });

    }


    /*
    کارت قرمز
    */

    const red=[];

    if(Math.random()<.06){

        const team=
            Math.random()<.5
            ?team1
            :team2;

        const teamName=
            team===team1
            ?team1Name
            :team2Name;

        const player=
            team.players[
                Math.floor(
                    Math.random()*
                    team.players.length
                )
            ];


        red.push({

            minute:
                Math.floor(random(35,88)),

            team:teamName,

            player:player.name

        });

    }


    /*
    بهترین بازیکن
    */

    const all=[
        ...team1.players,
        ...team2.players
    ];

    all.sort(
        (a,b)=>
        b.power-a.power
    );

    const best=all[0];


    /*
    نمایش
    */

    renderResult({

        team1:team1Name,
        team2:team2Name,

        score1,
        score2,

        possession1,
        possession2,

        shots1,
        shots2,

        onTarget1,
        onTarget2,

        fouls1,
        fouls2,

        free1,
        free2,

        corners1,
        corners2,

        goals,
        yellow,
        red,

        power1:Math.round(team1.power),
        power2:Math.round(team2.power),

        best:best.name

    });

}


/* =========================
   نمایش نتیجه
========================= */

function renderResult(data){

    const result=
        document.getElementById("result");

    let winner="🤝 مساوی";

    if(data.score1>data.score2)
        winner="🏆 "+data.team1+" برنده شد";

    if(data.score2>data.score1)
        winner="🏆 "+data.team2+" برنده شد";


    let goalsHTML="";

    if(!data.goals.length){

        goalsHTML=
        `<div class="event">
        ⚽ هیچ گلی به ثمر نرسید.
        </div>`;

    }else{

        data.goals.forEach(g=>{

            goalsHTML+=`
            <div class="event">
            ⚽ دقیقه ${g.minute}
            — ${escapeHTML(g.player)}
            <br>
            <span class="info">
            ${escapeHTML(g.team)}
            </span>
            </div>
            `;

        });

    }


    let yellowHTML="";

    if(!data.yellow.length){

        yellowHTML=
        `<div class="event">
        کارت زردی ثبت نشد.
        </div>`;

    }else{

        data.yellow.forEach(c=>{

            yellowHTML+=`
            <div class="event">
            🟨 دقیقه ${c.minute}
            — ${escapeHTML(c.player)}
            <br>
            <span class="info">
